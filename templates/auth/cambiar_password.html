{% extends "base.html" %}

{% block title %}Cambiar contraseña - BIC{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="card-title mb-4"><i class="bi bi-key"></i> Cambiar contraseña</h4>
                <form method="POST" action="{{ url_for('auth.cambiar_password') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label" for="password_actual">Contraseña actual</label>
                        <input type="password" class="form-control" id="password_actual"
                               name="password_actual" autocomplete="current-password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password_nueva">Nueva contraseña</label>
                        <input type="password" class="form-control" id="password_nueva"
                               name="password_nueva" autocomplete="new-password" minlength="12" required>
                        <div class="form-text">Mínimo 12 caracteres.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password_confirmacion">Repite la nueva contraseña</label>
                        <input type="password" class="form-control" id="password_confirmacion"
                               name="password_confirmacion" autocomplete="new-password" minlength="12" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
